<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>계절에 따라 달라지는 바다와 방어</title><link rel="stylesheet" href="style.css"></head>
<body><main class="experience"><section class="scroll-space" aria-label="봄 여름 가을 겨울, 방어와 바다의 변화"><div class="stage"><div class="artboard" id="artboard">
<!-- 01. 배경 네 장은 한 번에 하나만 표시하며, 경계에서만 교차 페이드 -->
<div class="seas" aria-hidden="true"><img class="sea" src="assets/spring.png" alt=""><img class="sea" src="assets/summer.png" alt=""><img class="sea" src="assets/autumn.png" alt=""><img class="sea" src="assets/winter.png" alt=""></div>
<!-- 02. 바다 이미지의 투명한 상단 영역은 흰색 바탕을 그대로 드러냅니다 -->

<!-- 02. 사용자가 준 계절표 PNG를 수정 없이 사용 -->
<img class="season-line" src="assets/season-line.png" alt="계절표: 겨울, 가을, 여름, 봄"><img class="silhouette" id="silhouette" src="assets/silhouette.png" alt="계절 곡선을 따라 이동하는 방어 실루엣">
<!-- 03. 사용자가 새로 제공한 온도계 찐-20, 찐-23 PNG 두 장 사용 -->
<div class="thermometer"><img src="assets/thermometer-base.png" alt="원본 수온계, 0~25도 눈금"><div class="ink-clip" id="mercury" aria-hidden="true"><img src="assets/thermometer-ink.png" alt=""></div><div class="ink-bulb" aria-hidden="true"><img src="assets/thermometer-ink.png" alt=""></div></div>
<!-- 04. 방어는 하나의 일러스트를 몸통과 꼬리로 나눠 부드럽게 변형 -->
<div class="fish-arrival" id="fishArrival"><div class="fish-swim"><img class="fish-body" src="assets/fish-body.png" alt=""><img class="fish-tail" src="assets/fish-tail.png" alt=""><span class="sr-only">헤엄치는 방어</span></div></div>
<p class="description" id="description">같은 바다도 계절에 따라 수온 구조가 달라진다. 이러한 수온변화는 방어의 이동과 생활에 영향을 준다.<span>Even the same sea changes its temperature structure depending on the season.<br>These temperature changes affect the movement and life of fish.</span></p>
</div></div></section></main><script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script><script src="script.js"></script></body></html>
